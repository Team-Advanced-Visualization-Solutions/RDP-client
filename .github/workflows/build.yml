name: Build RDP-client

permissions:
  contents: write

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential ninja-build \
            libssl-dev \
            libx11-dev libxext-dev libxcursor-dev libxrender-dev \
            libxfixes-dev libxi-dev libxrandr-dev libxdamage-dev \
            libxinerama-dev libxv-dev \
            libpulse-dev libcups2-dev libfuse3-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libicu-dev libkrb5-dev liburiparser-dev libusb-1.0-0-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/RDP-client

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Stage install
        run: |
          cmake --install build --prefix staging/opt/RDP-client
          tar czf RDP-client-linux-x86_64.tar.gz -C staging .
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDP-client-linux-x86_64
          path: RDP-client-linux-x86_64.tar.gz
          if-no-files-found: error

  build-fedora:
    runs-on: ubuntu-22.04
    container: fedora:latest
    steps:
      - name: Install deps (dnf)
        run: |
          dnf install -y git cmake gcc gcc-c++ ninja-build tar \
            openssl-devel \
            libX11-devel libXext-devel libXcursor-devel libXrender-devel \
            libXfixes-devel libXi-devel libXrandr-devel libXdamage-devel \
            libXinerama-devel libXv-devel \
            pulseaudio-libs-devel cups-devel fuse3-devel ffmpeg-free-devel \
            libicu-devel krb5-devel uriparser-devel libusb1-devel

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/RDP-client

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Stage install
        run: |
          cmake --install build --prefix staging/opt/RDP-client
          tar czf RDP-client-linux-x86_64-fedora.tar.gz -C staging .
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDP-client-linux-x86_64-fedora
          path: RDP-client-linux-x86_64-fedora.tar.gz
          if-no-files-found: error

  release:
    needs: [build-ubuntu, build-fedora]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Ubuntu artifact
        uses: actions/download-artifact@v4
        with:
          name: RDP-client-linux-x86_64
          path: .

      - name: Download Fedora artifact
        uses: actions/download-artifact@v4
        with:
          name: RDP-client-linux-x86_64-fedora
          path: .

      - name: Verify artifacts
        run: ls -lh *.tar.gz

      - uses: actions/checkout@v4

      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "RDP-client ${GITHUB_REF_NAME}" \
            --generate-notes \
            RDP-client-linux-x86_64.tar.gz \
            RDP-client-linux-x86_64-fedora.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
